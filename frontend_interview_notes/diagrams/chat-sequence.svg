<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 945" width="1100" height="945" role="img" aria-labelledby="chat-sequence-title chat-sequence-desc" font-family="system-ui, sans-serif" fill="#17233b"><title id="chat-sequence-title">Send sequence: durable acceptance before delivery</title><desc id="chat-sequence-desc">Time moves downward. The service commits a message and outbox before acknowledging the sender; asynchronous relay/fanout reaches the recipient. A lost acknowledgement is resolved by retrying the same clientMessageId.</desc><defs><marker id="chat-sequence-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#647792" stroke-width="1.4"/></marker><marker id="chat-sequence-start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1L1 4L7 7" fill="none" stroke="#647792" stroke-width="1.4"/></marker></defs><rect width="1100" height="945" fill="#fff"/><polyline points="100,125 325,125" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#chat-sequence-arrow)" /><g><rect x="92.0" y="99" width="241.0" height="24" rx="4" fill="#fff"/><text x="212.5" y="115" text-anchor="middle" font-size="14" fill="#36516d">1. send stable clientMessageId</text></g><polyline points="325,210 550,210" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#chat-sequence-arrow)" /><g><rect x="317.0" y="184" width="241.0" height="24" rx="4" fill="#fff"/><text x="437.5" y="200" text-anchor="middle" font-size="14" fill="#36516d">2. authorize + dedupe + commit</text></g><polyline points="550,295 325,295" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#chat-sequence-arrow)" /><g><rect x="324.5" y="269" width="226.0" height="24" rx="4" fill="#fff"/><text x="437.5" y="285" text-anchor="middle" font-size="14" fill="#36516d">3. durable result + sequence</text></g><polyline points="325,380 100,380" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#chat-sequence-arrow)" /><g><rect x="107.0" y="354" width="211.0" height="24" rx="4" fill="#fff"/><text x="212.5" y="370" text-anchor="middle" font-size="14" fill="#36516d">4. accepted (canonical ID)</text></g><polyline points="550,465 775,465" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#chat-sequence-arrow)" /><g><rect x="527.0" y="439" width="271.0" height="24" rx="4" fill="#fff"/><text x="662.5" y="455" text-anchor="middle" font-size="14" fill="#36516d">5. poll committed outbox → publish</text></g><polyline points="775,550 1000,550" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#chat-sequence-arrow)" /><g><rect x="774.5" y="524" width="226.0" height="24" rx="4" fill="#fff"/><text x="887.5" y="540" text-anchor="middle" font-size="14" fill="#36516d">6. message event via gateway</text></g><polyline points="1000,635 325,635" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#chat-sequence-arrow)" /><g><rect x="527.0" y="609" width="271.0" height="24" rx="4" fill="#fff"/><text x="662.5" y="625" text-anchor="middle" font-size="14" fill="#36516d">7. device delivery acknowledgement</text></g><polyline points="100,720 325,720" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#chat-sequence-arrow)" /><g><rect x="92.0" y="694" width="241.0" height="24" rx="4" fill="#fff"/><text x="212.5" y="710" text-anchor="middle" font-size="14" fill="#36516d">8. retry same key if uncertain</text></g><polyline points="325,805 100,805" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#chat-sequence-arrow)" /><g><rect x="110.75" y="779" width="203.5" height="24" rx="4" fill="#fff"/><text x="212.5" y="795" text-anchor="middle" font-size="14" fill="#36516d">9. original stored result</text></g><g><rect x="8" y="20" width="184" height="58" rx="9" fill="#f3f5f8" stroke="#a7b3c5"/><text x="100.0" y="49" text-anchor="middle" font-size="18" font-weight="650">Sender UI</text></g><g><rect x="233" y="20" width="184" height="58" rx="9" fill="#f3f5f8" stroke="#a7b3c5"/><text x="325.0" y="49" text-anchor="middle" font-size="18" font-weight="650">Message service</text></g><g><rect x="458" y="20" width="184" height="58" rx="9" fill="#f3f5f8" stroke="#a7b3c5"/><text x="550.0" y="49" text-anchor="middle" font-size="18" font-weight="650">Database/outbox</text></g><g><rect x="683" y="20" width="184" height="58" rx="9" fill="#f3f5f8" stroke="#a7b3c5"/><text x="775.0" y="49" text-anchor="middle" font-size="18" font-weight="650">Relay / fanout</text></g><g><rect x="908" y="20" width="184" height="58" rx="9" fill="#f3f5f8" stroke="#a7b3c5"/><text x="1000.0" y="49" text-anchor="middle" font-size="18" font-weight="650">Recipient UI</text></g><line x1="100" y1="78" x2="100" y2="910" stroke="#bcc8d8" stroke-dasharray="5 5"/><line x1="325" y1="78" x2="325" y2="910" stroke="#bcc8d8" stroke-dasharray="5 5"/><line x1="550" y1="78" x2="550" y2="910" stroke="#bcc8d8" stroke-dasharray="5 5"/><line x1="775" y1="78" x2="775" y2="910" stroke="#bcc8d8" stroke-dasharray="5 5"/><line x1="1000" y1="78" x2="1000" y2="910" stroke="#bcc8d8" stroke-dasharray="5 5"/><text x="30" y="937" font-size="13" fill="#465773">Gateway/broker hops are expanded in the system diagram. Dashed arrows are replies/acknowledgements.</text></svg>
