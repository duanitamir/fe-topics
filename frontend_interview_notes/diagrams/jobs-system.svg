<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" width="1100" height="800" role="img" aria-labelledby="jobs-system-title jobs-system-desc" font-family="system-ui, sans-serif" fill="#17233b"><title id="jobs-system-title">Job discovery: query and indexing paths</title><desc id="jobs-system-desc">Browser sends a canonical query to a search API through a load balancer. The API executes hits and aggregations against a search index. Job updates flow from a transactional database through an outbox and indexer; the search index is eventually consistent.</desc><defs><marker id="jobs-system-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#647792" stroke-width="1.4"/></marker><marker id="jobs-system-start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1L1 4L7 7" fill="none" stroke="#647792" stroke-width="1.4"/></marker></defs><rect width="1100" height="800" fill="#fff"/><polyline points="350,84 440,84" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#jobs-system-arrow)" marker-start="url(#jobs-system-start)" /><g><rect x="340.75" y="49" width="98.5" height="24" rx="4" fill="#fff"/><text x="390" y="65" text-anchor="middle" font-size="14" fill="#36516d">HTTPS query</text></g><polyline points="585,128 585,260" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#jobs-system-arrow)" marker-start="url(#jobs-system-start)" /><g><rect x="517.0" y="184" width="136.0" height="24" rx="4" fill="#fff"/><text x="585" y="200" text-anchor="middle" font-size="14" fill="#36516d">normalized query</text></g><polyline points="585,348 585,490" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#jobs-system-arrow)" marker-start="url(#jobs-system-start)" /><g><rect x="498.25" y="409" width="173.5" height="24" rx="4" fill="#fff"/><text x="585" y="425" text-anchor="middle" font-size="14" fill="#36516d">search + aggregations</text></g><polyline points="730,304 800,304" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#jobs-system-arrow)" marker-start="url(#jobs-system-start)" /><g><rect x="738.25" y="269" width="53.5" height="24" rx="4" fill="#fff"/><text x="765" y="285" text-anchor="middle" font-size="14" fill="#36516d">cache</text></g><polyline points="195,578 195,680" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#jobs-system-arrow)" /><g><rect x="145.75" y="619" width="98.5" height="24" rx="4" fill="#fff"/><text x="195" y="635" text-anchor="middle" font-size="14" fill="#36516d">transaction</text></g><polyline points="340,724 800,724" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#jobs-system-arrow)" /><g><rect x="465.75" y="694" width="188.5" height="24" rx="4" fill="#fff"/><text x="560" y="710" text-anchor="middle" font-size="14" fill="#36516d">committed outbox events</text></g><polyline points="935,680 935,534 730,534" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#jobs-system-arrow)" /><g><rect x="805.75" y="569" width="188.5" height="24" rx="4" fill="#fff"/><text x="900" y="585" text-anchor="middle" font-size="14" fill="#36516d">versioned index updates</text></g><g><rect x="50" y="40" width="300" height="88" rx="9" fill="#edf3ff" stroke="#94afd8"/><text x="200.0" y="69" text-anchor="middle" font-size="18" font-weight="650">Browser / SSR route</text><text x="200.0" y="93" text-anchor="middle" font-size="14" fill="#465773">URL query; one result snapshot</text></g><g><rect x="440" y="40" width="290" height="88" rx="9" fill="#edf6f1" stroke="#94bba4"/><text x="585.0" y="69" text-anchor="middle" font-size="18" font-weight="650">Load balancer + API</text><text x="585.0" y="93" text-anchor="middle" font-size="14" fill="#465773">Validate; tenant/visibility scope</text></g><g><rect x="440" y="260" width="290" height="88" rx="9" fill="#edf6f1" stroke="#94bba4"/><text x="585.0" y="289" text-anchor="middle" font-size="18" font-weight="650">Query planner</text><text x="585.0" y="313" text-anchor="middle" font-size="14" fill="#465773">Hits + facets + category counts</text></g><g><rect x="440" y="490" width="290" height="88" rx="9" fill="#fff6e6" stroke="#c8ae78"/><text x="585.0" y="519" text-anchor="middle" font-size="18" font-weight="650">Search index</text><text x="585.0" y="543" text-anchor="middle" font-size="14" fill="#465773">Inverted index; aggregations</text></g><g><rect x="50" y="490" width="290" height="88" rx="9" fill="#edf6f1" stroke="#94bba4"/><text x="195.0" y="519" text-anchor="middle" font-size="18" font-weight="650">Job write application</text><text x="195.0" y="543" text-anchor="middle" font-size="14" fill="#465773">Validate job and taxonomy</text></g><g><rect x="50" y="680" width="290" height="88" rx="9" fill="#fff6e6" stroke="#c8ae78"/><text x="195.0" y="709" text-anchor="middle" font-size="18" font-weight="650">SQL + outbox</text><text x="195.0" y="733" text-anchor="middle" font-size="14" fill="#465773">Authoritative jobs; versions</text></g><g><rect x="800" y="680" width="270" height="88" rx="9" fill="#edf6f1" stroke="#94bba4"/><text x="935.0" y="709" text-anchor="middle" font-size="18" font-weight="650">Indexer workers</text><text x="935.0" y="733" text-anchor="middle" font-size="14" fill="#465773">Upsert/delete; retries; DLQ</text></g><g><rect x="800" y="260" width="270" height="88" rx="9" fill="#fff6e6" stroke="#c8ae78"/><text x="935.0" y="289" text-anchor="middle" font-size="18" font-weight="650">Bounded response cache</text><text x="935.0" y="313" text-anchor="middle" font-size="14" fill="#465773">Canonical query + scope</text></g></svg>
