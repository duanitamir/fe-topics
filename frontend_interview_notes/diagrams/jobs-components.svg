<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="jobs-components-title jobs-components-desc" font-family="system-ui, sans-serif" fill="#17233b"><title id="jobs-components-title">Job search frontend: ownership and communication</title><desc id="jobs-components-desc">SearchRoute owns URL parsing and the canonical query. A single query coordinator produces a complete snapshot for category navigation, facets, count and results. Local drafts do not own applied filters.</desc><defs><marker id="jobs-components-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#647792" stroke-width="1.4"/></marker><marker id="jobs-components-start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1L1 4L7 7" fill="none" stroke="#647792" stroke-width="1.4"/></marker></defs><rect width="1000" height="760" fill="#fff"/><polyline points="500,113 500,195" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#jobs-components-arrow)" /><g><rect x="523.25" y="144" width="113.5" height="24" rx="4" fill="#fff"/><text x="580" y="160" text-anchor="middle" font-size="14" fill="#36516d">query + scope</text></g><polyline points="390,283 390,345 165,345 165,410" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#jobs-components-arrow)" /><g><rect x="194.5" y="319" width="91.0" height="24" rx="4" fill="#fff"/><text x="240" y="335" text-anchor="middle" font-size="14" fill="#36516d">categories</text></g><polyline points="500,283 500,410" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#jobs-components-arrow)" /><g><rect x="509.5" y="339" width="61.0" height="24" rx="4" fill="#fff"/><text x="540" y="355" text-anchor="middle" font-size="14" fill="#36516d">facets</text></g><polyline points="610,283 610,345 835,345 835,410" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#jobs-components-arrow)" /><g><rect x="722.0" y="319" width="106.0" height="24" rx="4" fill="#fff"/><text x="775" y="335" text-anchor="middle" font-size="14" fill="#36516d">jobs + total</text></g><polyline points="500,635 500,550 665,550 665,240 680,240" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#jobs-components-arrow)" /><g><rect x="690.75" y="554" width="128.5" height="24" rx="4" fill="#fff"/><text x="755" y="570" text-anchor="middle" font-size="14" fill="#36516d">atomic response</text></g><polyline points="320,679 10,679 10,155 320,155 320,69" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#jobs-components-arrow)" /><g><rect x="73.25" y="594" width="233.5" height="24" rx="4" fill="#fff"/><text x="190" y="610" text-anchor="middle" font-size="14" fill="#36516d">selection → URL; reset cursor</text></g><g><rect x="320" y="25" width="360" height="88" rx="9" fill="#edf3ff" stroke="#94afd8"/><text x="500.0" y="54" text-anchor="middle" font-size="18" font-weight="650">SearchRoute / jobs</text><text x="500.0" y="78" text-anchor="middle" font-size="14" fill="#465773">URL → normalized SearchQuery</text></g><g><rect x="320" y="195" width="360" height="88" rx="9" fill="#f2edfa" stroke="#b7a3d0"/><text x="500.0" y="224" text-anchor="middle" font-size="18" font-weight="650">Search coordinator</text><text x="500.0" y="248" text-anchor="middle" font-size="14" fill="#465773">Query key; abort; generation guard</text></g><g><rect x="25" y="410" width="280" height="88" rx="9" fill="#edf3ff" stroke="#94afd8"/><text x="165.0" y="439" text-anchor="middle" font-size="18" font-weight="650">CategoryNavigation</text><text x="165.0" y="463" text-anchor="middle" font-size="14" fill="#465773">Breadcrumb + eligible children</text></g><g><rect x="360" y="410" width="280" height="88" rx="9" fill="#edf3ff" stroke="#94afd8"/><text x="500.0" y="439" text-anchor="middle" font-size="18" font-weight="650">FacetPanel</text><text x="500.0" y="463" text-anchor="middle" font-size="14" fill="#465773">Checkboxes; range drafts; chips</text></g><g><rect x="695" y="410" width="280" height="88" rx="9" fill="#edf3ff" stroke="#94afd8"/><text x="835.0" y="439" text-anchor="middle" font-size="18" font-weight="650">JobResults</text><text x="835.0" y="463" text-anchor="middle" font-size="14" fill="#465773">Count; cards; pagination</text></g><g><rect x="320" y="635" width="360" height="88" rx="9" fill="#edf6f1" stroke="#94bba4"/><text x="500.0" y="664" text-anchor="middle" font-size="18" font-weight="650">Search API adapter</text><text x="500.0" y="688" text-anchor="middle" font-size="14" fill="#465773">One response → one snapshot</text></g></svg>
