<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" width="1000" height="850" role="img" aria-labelledby="ac-components-title ac-components-desc" font-family="system-ui, sans-serif" fill="#17233b"><title id="ac-components-title">Autocomplete: host page and component composition</title><desc id="ac-components-desc">The host form imports the React entry point. The root owns one controller instance and distributes bindings. Input emits query/key events, Option emits selection events, and the adapter reads snapshots. DOM focus stays on the input.</desc><defs><marker id="ac-components-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#647792" stroke-width="1.4"/></marker><marker id="ac-components-start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1L1 4L7 7" fill="none" stroke="#647792" stroke-width="1.4"/></marker></defs><rect width="1000" height="850" fill="#fff"/><polyline points="500,113 500,195" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#ac-components-arrow)" marker-start="url(#ac-components-start)" /><g><rect x="547.0" y="139" width="166.0" height="24" rx="4" fill="#fff"/><text x="630" y="155" text-anchor="middle" font-size="14" fill="#36516d">props ↓ / onChange ↑</text></g><polyline points="360,283 360,335 165,335 165,385" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#ac-components-arrow)" /><g><rect x="129.5" y="314" width="121.0" height="24" rx="4" fill="#fff"/><text x="190" y="330" text-anchor="middle" font-size="14" fill="#36516d">input bindings</text></g><polyline points="500,283 500,385" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#ac-components-arrow)" /><g><rect x="518.25" y="324" width="143.5" height="24" rx="4" fill="#fff"/><text x="590" y="340" text-anchor="middle" font-size="14" fill="#36516d">items / activeKey</text></g><polyline points="640,283 640,335 835,335 835,385" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#ac-components-arrow)" /><g><rect x="769.5" y="314" width="121.0" height="24" rx="4" fill="#fff"/><text x="830" y="330" text-anchor="middle" font-size="14" fill="#36516d">request status</text></g><polyline points="500,473 500,565" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#ac-components-arrow)" /><g><rect x="534.5" y="504" width="91.0" height="24" rx="4" fill="#fff"/><text x="580" y="520" text-anchor="middle" font-size="14" fill="#36516d">item props</text></g><polyline points="165,473 165,790 265,790" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#ac-components-arrow)" /><g><rect x="89.5" y="644" width="151.0" height="24" rx="4" fill="#fff"/><text x="165" y="660" text-anchor="middle" font-size="14" fill="#36516d">input / key events</text></g><polyline points="500,653 500,745" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#ac-components-arrow)" /><g><rect x="540.75" y="689" width="98.5" height="24" rx="4" fill="#fff"/><text x="590" y="705" text-anchor="middle" font-size="14" fill="#36516d">SELECT(key)</text></g><polyline points="735,790 985,790 985,240 700,240" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#ac-components-arrow)" /><g><rect x="778.25" y="674" width="173.5" height="24" rx="4" fill="#fff"/><text x="865" y="690" text-anchor="middle" font-size="14" fill="#36516d">snapshot subscription</text></g><g><rect x="300" y="25" width="400" height="88" rx="9" fill="#edf3ff" stroke="#94afd8"/><text x="500.0" y="54" text-anchor="middle" font-size="18" font-weight="650">Host page / Form</text><text x="500.0" y="78" text-anchor="middle" font-size="14" fill="#465773">Domain value; validation; API/cache adapter</text></g><g><rect x="300" y="195" width="400" height="88" rx="9" fill="#edf3ff" stroke="#94afd8"/><text x="500.0" y="224" text-anchor="middle" font-size="18" font-weight="650">Autocomplete.Root</text><text x="500.0" y="248" text-anchor="middle" font-size="14" fill="#465773">One scoped owner; controlled prop contract</text></g><g><rect x="35" y="385" width="260" height="88" rx="9" fill="#edf3ff" stroke="#94afd8"/><text x="165.0" y="414" text-anchor="middle" font-size="18" font-weight="650">Autocomplete.Input</text><text x="165.0" y="438" text-anchor="middle" font-size="14" fill="#465773">Query, key and composition events</text></g><g><rect x="365" y="385" width="270" height="88" rx="9" fill="#edf3ff" stroke="#94afd8"/><text x="500.0" y="414" text-anchor="middle" font-size="18" font-weight="650">Autocomplete.Results</text><text x="500.0" y="438" text-anchor="middle" font-size="14" fill="#465773">Listbox; loading/empty/error states</text></g><g><rect x="705" y="385" width="260" height="88" rx="9" fill="#edf3ff" stroke="#94afd8"/><text x="835.0" y="414" text-anchor="middle" font-size="18" font-weight="650">Autocomplete.Status</text><text x="835.0" y="438" text-anchor="middle" font-size="14" fill="#465773">Polite feedback and safe retry UI</text></g><g><rect x="365" y="565" width="270" height="88" rx="9" fill="#edf3ff" stroke="#94afd8"/><text x="500.0" y="594" text-anchor="middle" font-size="18" font-weight="650">Autocomplete.Option × N</text><text x="500.0" y="618" text-anchor="middle" font-size="14" fill="#465773">Stable key / ID; pointer selection</text></g><g><rect x="265" y="745" width="470" height="88" rx="9" fill="#f2edfa" stroke="#b7a3d0"/><text x="500.0" y="774" text-anchor="middle" font-size="18" font-weight="650">React adapter + controller instance</text><text x="500.0" y="798" text-anchor="middle" font-size="14" fill="#465773">Subscriptions, state snapshots and semantic callbacks</text></g></svg>
