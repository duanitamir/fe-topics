<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850" role="img" aria-labelledby="chat-system-title chat-system-desc" font-family="system-ui, sans-serif" fill="#17233b"><title id="chat-system-title">Chat system: durable write and live fanout</title><desc id="chat-system-desc">HTTPS and WSS enter through a load balancer. The message service writes messages and outbox atomically. A relay publishes to a broker; fanout looks up device routes and sends events through gateways. History reads recover missed events.</desc><defs><marker id="chat-system-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#647792" stroke-width="1.4"/></marker><marker id="chat-system-start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1L1 4L7 7" fill="none" stroke="#647792" stroke-width="1.4"/></marker></defs><rect width="1100" height="850" fill="#fff"/><polyline points="535,113 535,180" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#chat-system-arrow)" marker-start="url(#chat-system-start)" /><g><rect x="560.75" y="138" width="98.5" height="24" rx="4" fill="#fff"/><text x="610" y="154" text-anchor="middle" font-size="14" fill="#36516d">HTTPS / WSS</text></g><polyline points="410,268 410,305 170,305 170,350" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#chat-system-arrow)" marker-start="url(#chat-system-start)" /><g><rect x="193.25" y="284" width="113.5" height="24" rx="4" fill="#fff"/><text x="250" y="300" text-anchor="middle" font-size="14" fill="#36516d">HTTP requests</text></g><polyline points="540,268 540,350" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#chat-system-arrow)" marker-start="url(#chat-system-start)" /><g><rect x="557.0" y="299" width="166.0" height="24" rx="4" fill="#fff"/><text x="640" y="315" text-anchor="middle" font-size="14" fill="#36516d">WS commands / events</text></g><polyline points="170,438 170,540" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#chat-system-arrow)" marker-start="url(#chat-system-start)" /><g><rect x="98.25" y="479" width="143.5" height="24" rx="4" fill="#fff"/><text x="170" y="495" text-anchor="middle" font-size="14" fill="#36516d">application calls</text></g><polyline points="540,438 540,584 310,584" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#chat-system-arrow)" /><g><rect x="350.75" y="554" width="188.5" height="24" rx="4" fill="#fff"/><text x="445" y="570" text-anchor="middle" font-size="14" fill="#36516d">send / receipt commands</text></g><polyline points="170,628 170,730" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#chat-system-arrow)" marker-start="url(#chat-system-start)" /><g><rect x="95.75" y="674" width="158.5" height="24" rx="4" fill="#fff"/><text x="175" y="690" text-anchor="middle" font-size="14" fill="#36516d">transaction / query</text></g><polyline points="310,774 390,774" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#chat-system-arrow)" /><g><rect x="319.5" y="740" width="61.0" height="24" rx="4" fill="#fff"/><text x="350" y="756" text-anchor="middle" font-size="14" fill="#36516d">outbox</text></g><polyline points="690,774 735,774 735,584 780,584" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#chat-system-arrow)" /><g><rect x="700.75" y="659" width="68.5" height="24" rx="4" fill="#fff"/><text x="735" y="675" text-anchor="middle" font-size="14" fill="#36516d">publish</text></g><polyline points="920,628 920,730" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#chat-system-arrow)" /><g><rect x="890.75" y="669" width="68.5" height="24" rx="4" fill="#fff"/><text x="925" y="685" text-anchor="middle" font-size="14" fill="#36516d">consume</text></g><polyline points="1060,774 1080,774 1080,394 1060,394" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#chat-system-arrow)" /><g><rect x="967.0" y="469" width="106.0" height="24" rx="4" fill="#fff"/><text x="1020" y="485" text-anchor="middle" font-size="14" fill="#36516d">route lookup</text></g><polyline points="780,774 720,774 720,470 690,470 690,394" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#chat-system-arrow)" /><g><rect x="448.25" y="447" width="233.5" height="24" rx="4" fill="#fff"/><text x="565" y="463" text-anchor="middle" font-size="14" fill="#36516d">live events to owning gateway</text></g><g><rect x="360" y="25" width="350" height="88" rx="9" fill="#edf3ff" stroke="#94afd8"/><text x="535.0" y="54" text-anchor="middle" font-size="18" font-weight="650">Browser clients</text><text x="535.0" y="78" text-anchor="middle" font-size="14" fill="#465773">Sender, recipient and other devices</text></g><g><rect x="360" y="180" width="350" height="88" rx="9" fill="#f3f5f8" stroke="#a7b3c5"/><text x="535.0" y="209" text-anchor="middle" font-size="18" font-weight="650">Load balancer</text><text x="535.0" y="233" text-anchor="middle" font-size="14" fill="#465773">HTTPS / WSS; readiness and draining</text></g><g><rect x="30" y="350" width="280" height="88" rx="9" fill="#edf6f1" stroke="#94bba4"/><text x="170.0" y="379" text-anchor="middle" font-size="18" font-weight="650">HTTP application</text><text x="170.0" y="403" text-anchor="middle" font-size="14" fill="#465773">History and membership endpoints</text></g><g><rect x="390" y="350" width="300" height="88" rx="9" fill="#edf6f1" stroke="#94bba4"/><text x="540.0" y="379" text-anchor="middle" font-size="18" font-weight="650">WebSocket gateways</text><text x="540.0" y="403" text-anchor="middle" font-size="14" fill="#465773">Socket ownership; bounded buffers</text></g><g><rect x="780" y="350" width="280" height="88" rx="9" fill="#fff6e6" stroke="#c8ae78"/><text x="920.0" y="379" text-anchor="middle" font-size="18" font-weight="650">Connection directory</text><text x="920.0" y="403" text-anchor="middle" 