<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 860" width="1000" height="860" role="img" aria-labelledby="ac-system-title ac-system-desc" font-family="system-ui, sans-serif" fill="#17233b"><title id="ac-system-title">Autocomplete: core, framework adapter and data boundary</title><desc id="ac-system-desc">Host props enter the React adapter, which dispatches events and reads immutable snapshots from a TypeScript controller. A pure reducer updates state. An async coordinator owns request generation and cancellation; an injected source accesses a local index or remote API/cache.</desc><defs><marker id="ac-system-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#647792" stroke-width="1.4"/></marker><marker id="ac-system-start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1L1 4L7 7" fill="none" stroke="#647792" stroke-width="1.4"/></marker></defs><rect width="1000" height="860" fill="#fff"/><polyline points="500,113 500,195" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#ac-system-arrow)" marker-start="url(#ac-system-start)" /><g><rect x="540.75" y="139" width="218.5" height="24" rx="4" fill="#fff"/><text x="650" y="155" text-anchor="middle" font-size="14" fill="#36516d">config / controlled changes</text></g><polyline points="370,283 370,335 235,335 235,395" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#ac-system-arrow)" marker-start="url(#ac-system-start)" /><g><rect x="157.0" y="314" width="166.0" height="24" rx="4" fill="#fff"/><text x="240" y="330" text-anchor="middle" font-size="14" fill="#36516d">dispatch / snapshots</text></g><polyline points="435,439 570,439" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#ac-system-arrow)" marker-start="url(#ac-system-start)" /><g><rect x="439.5" y="404" width="121.0" height="24" rx="4" fill="#fff"/><text x="500" y="420" text-anchor="middle" font-size="14" fill="#36516d">jobs / results</text></g><polyline points="235,483 235,595" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#ac-system-arrow)" marker-start="url(#ac-system-start)" /><g><rect x="139.5" y="534" width="211.0" height="24" rx="4" fill="#fff"/><text x="245" y="550" text-anchor="middle" font-size="14" fill="#36516d">state + event → next state</text></g><polyline points="765,483 765,595" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#ac-system-arrow)" marker-start="url(#ac-system-start)" /><g><rect x="650.75" y="534" width="248.5" height="24" rx="4" fill="#fff"/><text x="775" y="550" text-anchor="middle" font-size="14" fill="#36516d">query + signal / items or error</text></g><polyline points="765,683 765,755" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#ac-system-arrow)" marker-start="url(#ac-system-start)" /><g><rect x="685.75" y="709" width="158.5" height="24" rx="4" fill="#fff"/><text x="765" y="725" text-anchor="middle" font-size="14" fill="#36516d">local call OR HTTPS</text></g><g><rect x="290" y="25" width="420" height="88" rx="9" fill="#edf3ff" stroke="#94afd8"/><text x="500.0" y="54" text-anchor="middle" font-size="18" font-weight="650">Host application</text><text x="500.0" y="78" text-anchor="middle" font-size="14" fill="#465773">Item model, labels, keys, auth/cache scope</text></g><g><rect x="290" y="195" width="420" height="88" rx="9" fill="#edf3ff" stroke="#94afd8"/><text x="500.0" y="224" text-anchor="middle" font-size="18" font-weight="650">React adapter + optional UI</text><text x="500.0" y="248" text-anchor="middle" font-size="14" fill="#465773">Bindings, stable IDs, lifecycle and subscriptions</text></g><g><rect x="35" y="395" width="400" height="88" rx="9" fill="#f2edfa" stroke="#b7a3d0"/><text x="235.0" y="424" text-anchor="middle" font-size="18" font-weight="650">Framework-independent controller</text><text x="235.0" y="448" text-anchor="middle" font-size="14" fill="#465773">Immutable snapshot; dispatch and subscribe</text></g><g><rect x="570" y="395" width="390" height="88" rx="9" fill="#f2edfa" stroke="#b7a3d0"/><text x="765.0" y="424" text-anchor="middle" font-size="18" font-weight="650">Async coordinator</text><text x="765.0" y="448" text-anchor="middle" font-size="14" fill="#465773">Debounce, AbortSignal, generation guards</text></g><g><rect x="35" y="595" width="400" height="88" rx="9" fill="#f2edfa" stroke="#b7a3d0"/><text x="235.0" y="624" text-anchor="middle" font-size="18" font-weight="650">Pure reducer / selectors</text><text x="235.0" y="648" text-anchor="middle" font-size="14" fill="#465773">Valid transitions; derived active/selected state</text></g><g><rect x="570" y="595" width="390" height="88" rx="9" fill="#edf6f1" stroke="#94bba4"/><text x="765.0" y="624" text-anchor="middle" font-size="18" font-weight="650">Injected DataSource&lt;T&gt;</text><text x="765.0" y="648" text-anchor="middle" font-size="14" fill="#465773">Host adapter; validation; cache/cancellation policy</text></g><g><rect x="570" y="755" width="390" height="88" rx="9" fill="#fff6e6" stroke="#c8ae78"/><text x="765.0" y="784" text-anchor="middle" font-size="18" font-weight="650">Local index OR remote API/cache</text><text x="765.0" y="808" text-anchor="middle" font-size="14" fill="#465773">No hard-coded endpoint or global personalized cache</text></g></svg>
