<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1200" width="1100" height="1200" role="img" aria-labelledby="ac-sequence-title ac-sequence-desc" font-family="system-ui, sans-serif" fill="#17233b"><title id="ac-sequence-title">Async query sequence: newer input owns the result</title><desc id="ac-sequence-desc">Time moves downward. Input starts a debounced query through the controller and coordinator. New input aborts old work; a stale completion is ignored even if cancellation is not honored. Only the current result is rendered.</desc><defs><marker id="ac-sequence-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#647792" stroke-width="1.4"/></marker><marker id="ac-sequence-start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1L1 4L7 7" fill="none" stroke="#647792" stroke-width="1.4"/></marker></defs><rect width="1100" height="1200" fill="#fff"/><polyline points="100,125 325,125" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#ac-sequence-arrow)" /><g><rect x="163.25" y="99" width="98.5" height="24" rx="4" fill="#fff"/><text x="212.5" y="115" text-anchor="middle" font-size="14" fill="#36516d">1. INPUT: a</text></g><polyline points="325,210 550,210" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#ac-sequence-arrow)" /><g><rect x="332.0" y="184" width="211.0" height="24" rx="4" fill="#fff"/><text x="437.5" y="200" text-anchor="middle" font-size="14" fill="#36516d">2. debounce then request A</text></g><polyline points="550,295 775,295" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#ac-sequence-arrow)" /><g><rect x="564.5" y="269" width="196.0" height="24" rx="4" fill="#fff"/><text x="662.5" y="285" text-anchor="middle" font-size="14" fill="#36516d">3. query a + AbortSignal</text></g><polyline points="100,380 325,380" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#ac-sequence-arrow)" /><g><rect x="159.5" y="354" width="106.0" height="24" rx="4" fill="#fff"/><text x="212.5" y="370" text-anchor="middle" font-size="14" fill="#36516d">4. INPUT: al</text></g><polyline points="325,465 550,465" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#ac-sequence-arrow)" /><g><rect x="332.0" y="439" width="211.0" height="24" rx="4" fill="#fff"/><text x="437.5" y="455" text-anchor="middle" font-size="14" fill="#36516d">5. invalidate A; request B</text></g><polyline points="550,550 775,550" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#ac-sequence-arrow)" /><g><rect x="579.5" y="524" width="166.0" height="24" rx="4" fill="#fff"/><text x="662.5" y="540" text-anchor="middle" font-size="14" fill="#36516d">6. abort A; query al</text></g><polyline points="775,635 550,635" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#ac-sequence-arrow)" /><g><rect x="572.0" y="609" width="181.0" height="24" rx="4" fill="#fff"/><text x="662.5" y="625" text-anchor="middle" font-size="14" fill="#36516d">7. B results (current)</text></g><polyline points="550,720 325,720" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#ac-sequence-arrow)" /><g><rect x="350.75" y="694" width="173.5" height="24" rx="4" fill="#fff"/><text x="437.5" y="710" text-anchor="middle" font-size="14" fill="#36516d">8. apply generation B</text></g><polyline points="325,805 100,805" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#ac-sequence-arrow)" /><g><rect x="99.5" y="779" width="226.0" height="24" rx="4" fill="#fff"/><text x="212.5" y="795" text-anchor="middle" font-size="14" fill="#36516d">9. snapshot → render options</text></g><polyline points="775,890 550,890" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#ac-sequence-arrow)" /><g><rect x="557.0" y="864" width="211.0" height="24" rx="4" fill="#fff"/><text x="662.5" y="880" text-anchor="middle" font-size="14" fill="#36516d">10. late A result: ignored</text></g><polyline points="100,975 325,975" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#ac-sequence-arrow)" /><g><rect x="107.0" y="949" width="211.0" height="24" rx="4" fill="#fff"/><text x="212.5" y="965" text-anchor="middle" font-size="14" fill="#36516d">11. SELECT stable item key</text></g><polyline points="325,1060 1000,1060" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#ac-sequence-arrow)" /><g><rect x="538.25" y="1034" width="248.5" height="24" rx="4" fill="#fff"/><text x="662.5" y="1050" text-anchor="middle" font-size="14" fill="#36516d">12. onValueChange(item, reason)</text></g><g><rect x="8" y="20" width="184" height="58" rx="9" fill="#f3f5f8" stroke="#a7b3c5"/><text x="100.0" y="49" text-anchor="middle" font-size="18" font-weight="650">Input / UI</text></g><g><rect x="233" y="20" width="184" height="58" rx="9" fill="#f3f5f8" stroke="#a7b3c5"/><text x="325.0" y="49" text-anchor="middle" font-size="18" font-weight="650">Controller</text></g><g><rect x="458" y="20" width="184" height="58" rx="9" fill="#f3f5f8" stroke="#a7b3c5"/><text x="550.0" y="49" text-anchor="middle" font-size="18" font-weight="650">Coordinator</text></g><g><rect x="683" y="20" width="184" height="58" rx="9" fill="#f3f5f8" stroke="#a7b3c5"/><text x="775.0" y="49" text-anchor="middle" font-size="18" font-weight="650">Data source</text></g><g><rect x="908" y="20" width="184" height="58" rx="9" fill="#f3f5f8" stroke="#a7b3c5"/><text x="1000.0" y="49" text-anchor="middle" font-size="18" font-weight="650">Host page</text></g><line x1="100" y1="78" x2="100" y2="1165" stroke="#bcc8d8" stroke-dasharray="5 5"/><line x1="325" y1="78" x2="325" y2="1165" stroke="#bcc8d8" stroke-dasharray="5 5"/><line x1="550" y1="78" x2="550" y2="1165" stroke="#bcc8d8" stroke-dasharray="5 5"/><line x1="775" y1="78" x2="775" y2="1165" stroke="#bcc8d8" stroke-dasharray="5 5"/><line x1="1000" y1="78" x2="1000" y2="1165" stroke="#bcc8d8" stroke-dasharray="5 5"/><text x="30" y="1192" font-size="13" fill="#465773">Controlled selection commits only when the host echoes the new value; onChange is a request, not a forced mutation.</text></svg>
