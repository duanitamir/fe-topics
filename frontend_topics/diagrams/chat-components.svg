<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" width="1000" height="880" role="img" aria-labelledby="chat-components-title chat-components-desc" font-family="system-ui, sans-serif" fill="#17233b"><title id="chat-components-title">Chat frontend: route, components and shared data</title><desc id="chat-components-desc">Solid arrows show page composition and props. Dashed arrows show runtime commands and data subscriptions. URL owns conversation selection; Composer owns draft; the message cache owns remote snapshots; the realtime adapter reconciles socket events.</desc><defs><marker id="chat-components-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#647792" stroke-width="1.4"/></marker><marker id="chat-components-start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1L1 4L7 7" fill="none" stroke="#647792" stroke-width="1.4"/></marker></defs><rect width="1000" height="880" fill="#fff"/><polyline points="370,113 370,150 180,150 180,195" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#chat-components-arrow)" /><g><rect x="183.25" y="131" width="53.5" height="24" rx="4" fill="#fff"/><text x="210" y="147" text-anchor="middle" font-size="14" fill="#36516d">props</text></g><polyline points="630,113 630,150 730,150 730,195" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#chat-components-arrow)" /><g><rect x="714.5" y="131" width="121.0" height="24" rx="4" fill="#fff"/><text x="775" y="147" text-anchor="middle" font-size="14" fill="#36516d">conversationId</text></g><polyline points="600,283 600,325 500,325 500,365" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#chat-components-arrow)" /><g><rect x="393.25" y="304" width="143.5" height="24" rx="4" fill="#fff"/><text x="465" y="320" text-anchor="middle" font-size="14" fill="#36516d">items / callbacks</text></g><polyline points="800,283 800,365" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#chat-components-arrow)" /><g><rect x="810.75" y="309" width="128.5" height="24" rx="4" fill="#fff"/><text x="875" y="325" text-anchor="middle" font-size="14" fill="#36516d">submit callback</text></g><polyline points="500,453 500,535" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#chat-components-arrow)" /><g><rect x="533.25" y="484" width="113.5" height="24" rx="4" fill="#fff"/><text x="590" y="500" text-anchor="middle" font-size="14" fill="#36516d">message props</text></g><polyline points="810,453 960,453 960,774 930,774" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#chat-components-arrow)" /><g><rect x="862.75" y="619" width="98.5" height="24" rx="4" fill="#fff"/><text x="912" y="635" text-anchor="middle" font-size="14" fill="#36516d">send intent</text></g><polyline points="590,774 430,774" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#chat-components-arrow)" /><g><rect x="434.5" y="738" width="151.0" height="24" rx="4" fill="#fff"/><text x="510" y="754" text-anchor="middle" font-size="14" fill="#36516d">merge / invalidate</text></g><polyline points="230,730 230,410 380,410" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#chat-components-arrow)" /><g><rect x="164.5" y="494" width="151.0" height="24" rx="4" fill="#fff"/><text x="240" y="510" text-anchor="middle" font-size="14" fill="#36516d">subscribe / render</text></g><polyline points="120,730 120,283" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#chat-components-arrow)" /><g><rect x="47.0" y="599" width="166.0" height="24" rx="4" fill="#fff"/><text x="130" y="615" text-anchor="middle" font-size="14" fill="#36516d">summary subscription</text></g><g><rect x="320" y="25" width="360" height="88" rx="9" fill="#edf3ff" stroke="#94afd8"/><text x="500.0" y="54" text-anchor="middle" font-size="18" font-weight="650">ChatRoute / page</text><text x="500.0" y="78" text-anchor="middle" font-size="14" fill="#465773">URL conversationId; layout and loaders</text></g><g><rect x="40" y="195" width="280" height="88" rx="9" fill="#edf3ff" stroke="#94afd8"/><text x="180.0" y="224" text-anchor="middle" font-size="18" font-weight="650">ConversationList</text><text x="180.0" y="248" text-anchor="middle" font-size="14" fill="#465773">Summaries; navigation links</text></g><g><rect x="540" y="195" width="380" height="88" rx="9" fill="#edf3ff" stroke="#94afd8"/><text x="730.0" y="224" text-anchor="middle" font-size="18" font-weight="650">ConversationPanel</text><text x="730.0" y="248" text-anchor="middle" font-size="14" fill="#465773">Selected conversation and scoped actions</text></g><g><rect x="380" y="365" width="240" height="88" rx="9" fill="#edf3ff" stroke="#94afd8"/><text x="500.0" y="394" text-anchor="middle" font-size="18" font-weight="650">MessageList</text><text x="500.0" y="418" text-anchor="middle" font-size="14" fill="#465773">Pages, scroll and virtualization</text></g><g><rect x="690" y="365" width="240" height="88" rx="9" fill="#edf3ff" stroke="#94afd8"/><text x="810.0" y="394" text-anchor="middle" font-size="18" font-weight="650">Composer</text><text x="810.0" y="418" text-anchor="middle" font-size="14" fill="#465773">Local draft; pending feedback</text></g><g><rect x="380" y="535" width="240" height="88" rx="9" fill="#edf3ff" stroke="#94afd8"/><text x="500.0" y="564" text-anchor="middle" font-size="18" font-weight="650">MessageRow</text><text x="500.0" y="588" text-anchor="middle" font-size="14" fill="#465773">Message text and receipt state</text></g><g><rect x="40" y="730" width="390" height="88" rx="9" fill="#fff6e6" stroke="#c8ae78"/><text x="235.0" y="759" text-anchor="middle" font-size="18" font-weight="650">Server-state message cache</text><text x="235.0" y="783" text-anchor="middle" font-size="14" fill="#465773">Canonical messages, receipts and cursors</text></g><g><rect x="590" y="730" width="340" height="88" rx="9" fill="#edf6f1" stroke="#94bba4"/><text x="760.0" y="759" text-anchor="middle" font-size="18" font-weight="650">Realtime / API adapter</text><text x="760.0" y="783" text-anchor="middle" font-size="14" fill="#465773">WS lifecycle; HTTP history + sends</text></g></svg>
