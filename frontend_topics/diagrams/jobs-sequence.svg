<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" width="1100" height="860" role="img" aria-labelledby="jobs-sequence-title jobs-sequence-desc" font-family="system-ui, sans-serif" fill="#17233b"><title id="jobs-sequence-title">Filter change: one coordinated search snapshot</title><desc id="jobs-sequence-desc">Time flows downward. The route changes query identity, cancels obsolete work and requests hits and all aggregations together. A late response cannot replace the current query.</desc><defs><marker id="jobs-sequence-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#647792" stroke-width="1.4"/></marker><marker id="jobs-sequence-start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1L1 4L7 7" fill="none" stroke="#647792" stroke-width="1.4"/></marker></defs><rect width="1100" height="860" fill="#fff"/><polyline points="100,125 325,125" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#jobs-sequence-arrow)" /><g><rect x="80.75" y="99" width="263.5" height="24" rx="4" fill="#fff"/><text x="212.5" y="115" text-anchor="middle" font-size="14" fill="#36516d">1. select full-time; reset cursor</text></g><polyline points="325,210 550,210" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#jobs-sequence-arrow)" /><g><rect x="324.5" y="184" width="226.0" height="24" rx="4" fill="#fff"/><text x="437.5" y="200" text-anchor="middle" font-size="14" fill="#36516d">2. new canonical query key B</text></g><polyline points="550,295 775,295" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#jobs-sequence-arrow)" /><g><rect x="564.5" y="269" width="196.0" height="24" rx="4" fill="#fff"/><text x="662.5" y="285" text-anchor="middle" font-size="14" fill="#36516d">3. abort A; GET search B</text></g><polyline points="775,380 1000,380" fill="none" stroke="#647792" stroke-width="1.7" marker-end="url(#jobs-sequence-arrow)" /><g><rect x="759.5" y="354" width="256.0" height="24" rx="4" fill="#fff"/><text x="887.5" y="370" text-anchor="middle" font-size="14" fill="#36516d">4. hits + all facet aggregations</text></g><polyline points="1000,465 775,465" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#jobs-sequence-arrow)" /><g><rect x="797.0" y="439" width="181.0" height="24" rx="4" fill="#fff"/><text x="887.5" y="455" text-anchor="middle" font-size="14" fill="#36516d">5. one search response</text></g><polyline points="775,550 550,550" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#jobs-sequence-arrow)" /><g><rect x="564.5" y="524" width="196.0" height="24" rx="4" fill="#fff"/><text x="662.5" y="540" text-anchor="middle" font-size="14" fill="#36516d">6. queryKey B + snapshot</text></g><polyline points="550,635 100,635" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#jobs-sequence-arrow)" /><g><rect x="208.25" y="609" width="233.5" height="24" rx="4" fill="#fff"/><text x="325.0" y="625" text-anchor="middle" font-size="14" fill="#36516d">7. commit all panels together</text></g><polyline points="775,720 550,720" fill="none" stroke="#477760" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#jobs-sequence-arrow)" /><g><rect x="542.0" y="694" width="241.0" height="24" rx="4" fill="#fff"/><text x="662.5" y="710" text-anchor="middle" font-size="14" fill="#36516d">8. late A: discard by identity</text></g><g><rect x="8" y="20" width="184" height="58" rx="9" fill="#f3f5f8" stroke="#a7b3c5"/><text x="100.0" y="49" text-anchor="middle" font-size="18" font-weight="650">Facet UI</text></g><g><rect x="233" y="20" width="184" height="58" rx="9" fill="#f3f5f8" stroke="#a7b3c5"/><text x="325.0" y="49" text-anchor="middle" font-size="18" font-weight="650">URL / query</text></g><g><rect x="458" y="20" width="184" height="58" rx="9" fill="#f3f5f8" stroke="#a7b3c5"/><text x="550.0" y="49" text-anchor="middle" font-size="18" font-weight="650">Coordinator</text></g><g><rect x="683" y="20" width="184" height="58" rx="9" fill="#f3f5f8" stroke="#a7b3c5"/><text x="775.0" y="49" text-anchor="middle" font-size="18" font-weight="650">Search API</text></g><g><rect x="908" y="20" width="184" height="58" rx="9" fill="#f3f5f8" stroke="#a7b3c5"/><text x="1000.0" y="49" text-anchor="middle" font-size="18" font-weight="650">Search index</text></g><line x1="100" y1="78" x2="100" y2="825" stroke="#bcc8d8" stroke-dasharray="5 5"/><line x1="325" y1="78" x2="325" y2="825" stroke="#bcc8d8" stroke-dasharray="5 5"/><line x1="550" y1="78" x2="550" y2="825" stroke="#bcc8d8" stroke-dasharray="5 5"/><line x1="775" y1="78" x2="775" y2="825" stroke="#bcc8d8" stroke-dasharray="5 5"/><line x1="1000" y1="78" x2="1000" y2="825" stroke="#bcc8d8" stroke-dasharray="5 5"/><text x="30" y="852" font-size="13" fill="#465773">Transport cancellation saves work; identity checks guarantee that obsolete responses never win.</text></svg>
